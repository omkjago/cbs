name: CI/CD Pipeline - Test & Deploy to Hosting

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  # --------------------------------------------------------------------------
  # 1. Continuous Integration (CI): Test PHP Backend & Build React Frontend
  # --------------------------------------------------------------------------
  ci-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup PHP Environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_mysql, sockets, openssl, mbstring, curl
          coverage: none

      # Verify PHP Syntax
      - name: Check PHP Syntax (Lint)
        run: |
          find src config database public -name "*.php" -exec php -l {} +

      # Run Automated Unit & Integration Tests
      - name: Run Backend Tests
        run: |
          php tests/test_phase1.php
          php tests/test_phase2.php
          php tests/test_phase3.php
          php tests/test_phase4.php

      # Setup Node.js for React Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      # Install & Build React Frontend
      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      # Archive Production Build Artifact
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: |
            public/
            config/
            src/
            database/
            workers/
            index.php
            .htaccess
            .env.example

  # --------------------------------------------------------------------------
  # 2. Continuous Deployment (CD): Deploy to Hosting Server (Runs on push)
  # --------------------------------------------------------------------------
  cd-deploy:
    name: Deploy to Hosting Server
    needs: ci-test-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    env:
      DEPLOY_SSH_HOST: ${{ secrets.SSH_HOST }}
      DEPLOY_FTP_SERVER: ${{ secrets.FTP_SERVER }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-dist

      # Option A: Deploy via SSH / Rsync (Recommended for VPS / Cloud Server)
      - name: Deploy via SSH / Rsync to Server
        if: env.DEPLOY_SSH_HOST != ''
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete --exclude='.git*' --exclude='.env' --exclude='node_modules'"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET: ${{ secrets.DEPLOY_TARGET_DIR || '/var/www/nms-gis' }}
        continue-on-error: true

      # Execute Remote Post-Deployment Tasks (Migrations, Cache, Permissions)
      - name: Run Post-Deploy Script on Remote Server
        if: env.DEPLOY_SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_TARGET_DIR || '/var/www/nms-gis' }}
            # Run database migrations
            php database/migrate.php || true
            # Set directory permissions for web server (www-data / nginx)
            chmod -R 755 .
            chmod -R 777 storage/ 2>/dev/null || true
            echo "Deployment completed successfully at $(date)!"

      # Option B: Deploy via FTP/FTPS (Alternative for Shared Hosting / cPanel)
      - name: Deploy via FTPS (Shared Hosting / cPanel)
        if: env.DEPLOY_FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR || '/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
        continue-on-error: true
